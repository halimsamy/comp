x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  # Self-hosted replacement for Upstash Redis: Valkey (BSD-licensed Redis fork) behind
  # SRH, which speaks the Upstash REST protocol so @upstash/redis and @upstash/ratelimit
  # work unchanged. Point UPSTASH_REDIS_REST_URL at http://redis-http and
  # UPSTASH_REDIS_REST_TOKEN at SRH_TOKEN in the app, portal and api env files.
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
  redis-http:
    image: hiett/serverless-redis-http:0.0.10 # last release (2024-05). shortcut: unmaintained community proxy, swap @upstash/* for ioredis if it breaks
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?set SRH_TOKEN to a long random string}
      SRH_CONNECTION_STRING: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  # Self-hosted S3-compatible object storage (SeaweedFS) replacing AWS S3. Set in the
  # app, portal and api env files: APP_AWS_ENDPOINT, APP_AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY,
  # APP_AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY, APP_AWS_REGION=us-east-1, and the bucket
  # names from S3_BUCKETS. Browsers upload/download via presigned URLs signed for
  # APP_AWS_ENDPOINT, so it must be one URL that both these containers and users'
  # browsers reach, e.g. https://files.example.com proxied (TLS) to port 8333.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -volume.max=0 -s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY to a long random string}
    ports:
      - '8333:8333'
    volumes:
      - s3_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://$$(hostname -i):8333/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
  s3-init:
    image: chrislusf/seaweedfs:4.50
    entrypoint: sh
    # Creates the buckets; re-runs are harmless ("already exists").
    command:
      - -c
      - 'for b in $$S3_BUCKETS; do echo "s3.bucket.create -name $$b" | weed shell -master=s3:9333; done'
    environment:
      S3_BUCKETS: ${S3_BUCKETS:-comp-attachments comp-questionnaires comp-knowledge-base comp-org-assets comp-device-agent}
    depends_on:
      s3:
        condition: service_healthy
    logging: *default-logging
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    logging: *default-logging
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    command: sh -lc "bunx prisma generate --schema=node_modules/@trycompai/db/dist/schema.prisma && bun packages/db/prisma/seed/seed.js"
    logging: *default-logging
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - '3000:3000'
    env_file:
      - apps/app/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -lc "node apps/app/server.js"
    logging: *default-logging
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL_PORTAL}
    ports:
      - '3002:3000'
    env_file:
      - apps/portal/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

volumes:
  valkey_data:
  s3_data:
